<script>
var CTX={};
try{var h=location.hash.slice(1);if(h)CTX=Object.fromEntries(new URLSearchParams(h));}catch(e){}


var STATE={massar:'',pin:'',name:'',answers:[]};
var _selA={};
var _startTime=Date.now();

async function verify(){
  var massar=document.getElementById('massar').value.trim();
  var pin=document.getElementById('pin').value.trim();
  var err=document.getElementById('login-error');err.style.display='none';
  if(!massar){showErr(err,'Please enter your Massar number.');return;}
  if(!pin||pin.length!==4){showErr(err,'Please enter your 4-digit PIN.');return;}
  setLoad('btn-verify',true,'Verifying…');
  try{
    var r=await post(getUrl(),{action:'verifyStudent',massarCode:massar,classId:CTX.classId||'',
      pin:pin,homeworkId:TEACHER_CONFIG.assignmentToken});
    if(!r.ok){showErr(err,r.error||'Incorrect details.');return;}
    STATE.massar=massar;STATE.pin=pin;STATE.name=r.studentName||massar;
    document.getElementById('verified-name').textContent=STATE.name;
    showStep('step-questions');buildQuestions();
  }catch(e){showErr(err,'Connection failed. Check your internet.');}
  finally{setLoad('btn-verify',false,'Start Homework');}
}

function buildQuestions(){
  var qs=TEACHER_CONFIG.questions;
  STATE.answers=qs.map(function(q){return q.type==='match'?new Array(q.pairs.length).fill(null):null;});
  var html=qs.map(function(q,i){
    var num='<div class="q-num">Question '+(i+1)+' · '+q.points+' pt'+(q.points>1?'s':'')+'</div>';
    var txt='<div class="q-text">'+esc(q.question)+'</div>';
    var hint=q.hint?'<div class="q-hint">💡 '+esc(q.hint)+'</div>':'';
    var body='';
    if(q.type==='mcq'){
      var L=['A','B','C','D'];
      body='<div class="mcq-options">'+q.options.map(function(o,j){
        return'<div class="mcq-opt" id="mcq-'+i+'-'+j+'" onclick="pickMCQ('+i+','+j+')">'
          +'<span class="letter">'+L[j]+'</span>'+esc(o)+'</div>';
      }).join('')+'</div>';
    }else if(q.type==='tf'){
      body='<div class="tf-options">'
        +'<div class="tf-opt" id="tf-'+i+'-true" onclick="pickTF('+i+',\'true\')">✓ True</div>'
        +'<div class="tf-opt" id="tf-'+i+'-false" onclick="pickTF('+i+',\'false\')">✗ False</div>'
        +'</div>';
    }else if(q.type==='fill'){
      body='<input class="fill-inp" id="fill-'+i+'" placeholder="Type your answer…" oninput="recordFill('+i+')">';
    }else if(q.type==='match'){
      /* Shuffle b items */
      var bItems=q.pairs.map(function(p,j){return{text:p.b,orig:j};});
      for(var k=bItems.length-1;k>0;k--){var j2=Math.floor(Math.random()*(k+1));var tmp=bItems[k];bItems[k]=bItems[j2];bItems[j2]=tmp;}
      q._shuffled=bItems;
      body='<div class="match-grid">'
        +'<div><div class="match-col-lbl">Column A</div>'
        +q.pairs.map(function(p,j){return'<div class="match-item" id="ma-'+i+'-'+j+'" onclick="pickMA('+i+','+j+')">'+esc(p.a)+'</div>';}).join('')
        +'</div><div><div class="match-col-lbl">Column B</div>'
        +bItems.map(function(p,j){return'<div class="match-item" id="mb-'+i+'-'+j+'" onclick="pickMB('+i+','+j+','+p.orig+')">'+esc(p.text)+'</div>';}).join('')
        +'</div></div>';
    }
    return'<div class="q-card">'+num+txt+hint+body+'<div class="q-feedback" id="fb-'+i+'"></div></div>';
  }).join('');
  document.getElementById('q-wrap').innerHTML=html;
  updateProg();
}

var _mcq={};
function pickMCQ(qi,oi){
  var prev=_mcq[qi];if(prev!==undefined)document.getElementById('mcq-'+qi+'-'+prev).classList.remove('selected');
  document.getElementById('mcq-'+qi+'-'+oi).classList.add('selected');_mcq[qi]=oi;STATE.answers[qi]=oi;updateProg();
}
function pickTF(qi,v){
  ['true','false'].forEach(function(x){document.getElementById('tf-'+qi+'-'+x).classList.remove('selected');});
  document.getElementById('tf-'+qi+'-'+v).classList.add('selected');STATE.answers[qi]=v;updateProg();
}
function recordFill(qi){STATE.answers[qi]=document.getElementById('fill-'+qi).value;updateProg();}
function pickMA(qi,ai){
  var qs=TEACHER_CONFIG.questions;
  qs[qi].pairs.forEach(function(_,j){document.getElementById('ma-'+qi+'-'+j).classList.remove('sel-a');});
  document.getElementById('ma-'+qi+'-'+ai).classList.add('sel-a');_selA[qi]=ai;
}
function pickMB(qi,bi,orig){
  var ai=_selA[qi];if(ai===undefined)return;
  if(!Array.isArray(STATE.answers[qi]))STATE.answers[qi]=new Array(TEACHER_CONFIG.questions[qi].pairs.length).fill(null);
  STATE.answers[qi][ai]=orig;
  var pn=ai+1;
  var aEl=document.getElementById('ma-'+qi+'-'+ai);
  var bEl=document.getElementById('mb-'+qi+'-'+bi);
  aEl.querySelectorAll('.pair-num').forEach(function(n){n.remove();});
  bEl.querySelectorAll('.pair-num').forEach(function(n){n.remove();});
  var s1=document.createElement('span');s1.className='pair-num';s1.textContent=pn;aEl.appendChild(s1);
  var s2=document.createElement('span');s2.className='pair-num';s2.textContent=pn;bEl.appendChild(s2);
  aEl.classList.remove('sel-a');_selA[qi]=undefined;updateProg();
}

function updateProg(){
  var qs=TEACHER_CONFIG.questions;
  var done=STATE.answers.filter(function(a,i){
    if(qs[i].type==='match')return Array.isArray(a)&&a.some(function(v){return v!==null;});
    return a!==null&&a!==undefined&&a!=='';
  }).length;
  document.getElementById('pbar').style.width=Math.round(done/qs.length*100)+'%';
  document.getElementById('plabel').textContent=done+' / '+qs.length+' answered';
}

async function submitAll(){
  var qs=TEACHER_CONFIG.questions;
  var err=document.getElementById('submit-error');err.style.display='none';
  var unans=STATE.answers.filter(function(a,i){
    if(qs[i].type==='match')return!Array.isArray(a)||a.every(function(v){return v===null;});
    return a===null||a===undefined||a==='';
  }).length;
  if(unans>0){showErr(err,'Please answer all questions before submitting.');return;}
  var totalPts=0,maxPts=0,log=[];
  qs.forEach(function(q,i){
    var pts=q.points||1;maxPts+=pts;var correct=false;var earned=0;var given=STATE.answers[i];
    if(q.type==='mcq'){correct=given===q.correct;}
    else if(q.type==='tf'){correct=String(given)===String(q.correct);}
    else if(q.type==='fill'){
      var norm=function(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ');};
      correct=norm(given)===norm(q.correct);
      if(!correct&&q.accept)correct=q.accept.some(function(a){return norm(given)===norm(a);});
    }else if(q.type==='match'){
      var pairCorrect=0;
      q.pairs.forEach(function(_,j){if(Array.isArray(given)&&given[j]===j)pairCorrect++;});
      earned=Math.round(pts*pairCorrect/q.pairs.length);correct=pairCorrect===q.pairs.length;
      totalPts+=earned;log.push({qIndex:i,type:'match',answer:given,correct:correct,points:earned});
      showMatchFeedback(i,q,correct,earned,pts,given);return;
    }
    if(correct)earned=pts;
    totalPts+=earned;
    log.push({qIndex:i,type:q.type,answer:given,correct:correct,points:earned});
    showFeedback(i,q,correct,earned,pts,given);
  });
  showResults(totalPts,maxPts,log);
  var maxScore=TEACHER_CONFIG.maxScore||20;
  var scaled=maxPts>0?Math.round(totalPts/maxPts*maxScore):0;
  setLoad('btn-submit',true,'Sending…');
  try{
    var r=await post(getUrl(),{
      action:'submitHomework',classId:CTX.classId||'',termId:CTX.termId||'',
      assignmentToken:TEACHER_CONFIG.assignmentToken,homeworkId:TEACHER_CONFIG.assignmentToken,
      massarCode:STATE.massar,pin:STATE.pin,score:scaled,maxScore:maxScore,
      timeTaken:Math.round((Date.now()-_startTime)/1000),answers:log
    });
    if(!r.ok)document.getElementById('sc-label').textContent+=' (⚠ Not saved: '+(r.error||'error')+')';
    else{try{
      /* Send to container tab that opened this page */
      var target = window.opener || window.parent;
      target.postMessage({type:'hw_submitted',score:scaled,maxScore:maxScore,
        assignmentToken:TEACHER_CONFIG.assignmentToken},'*');
      /* Close this tab after a short delay */
      setTimeout(function(){ window.close(); }, 3000);
    }catch(e){}}
  }catch(e){document.getElementById('sc-label').textContent+=' (⚠ Not saved — no internet)';}
  finally{setLoad('btn-submit',false,'Submit Answers');}
}

function showFeedback(i,q,correct,earned,pts,given){
  var fb=document.getElementById('fb-'+i);if(!fb)return;
  fb.className='q-feedback '+(correct?'correct':'wrong');
  var msg=correct?'✓ Correct! (+'+earned+' pt'+(pts>1?'s':'')+')'
    :'✗ Incorrect. The correct answer is "'+q.correct+'".';
  if(!correct&&q.explanation)msg+=' — '+q.explanation;
  fb.textContent=msg;fb.style.display='block';
  if(q.type==='mcq'){
    if(given!==null)document.getElementById('mcq-'+i+'-'+given).classList.add(correct?'correct':'wrong');
    if(!correct)document.getElementById('mcq-'+i+'-'+q.correct).classList.add('correct');
  }else if(q.type==='tf'){
    if(given)document.getElementById('tf-'+i+'-'+given).classList.add(correct?'correct':'wrong');
    if(!correct)document.getElementById('tf-'+i+'-'+q.correct).classList.add('correct');
  }else if(q.type==='fill'){document.getElementById('fill-'+i).classList.add(correct?'correct':'wrong');}
  var card=document.getElementById('q-wrap').children[i];
  if(card)card.style.pointerEvents='none';
}

function showMatchFeedback(i,q,correct,earned,pts,given){
  var fb=document.getElementById('fb-'+i);if(!fb)return;
  fb.className='q-feedback '+(correct?'correct':'wrong');
  fb.textContent=correct?'✓ All pairs correct! (+'+earned+' pts)':'✗ Some pairs wrong. '+earned+'/'+pts+' pts.';
  fb.style.display='block';
  q.pairs.forEach(function(_,j){
    var isRight=Array.isArray(given)&&given[j]===j;
    var aEl=document.getElementById('ma-'+i+'-'+j);
    if(aEl){aEl.classList.add(isRight?'matched':'wrong-m');aEl.querySelectorAll('.pair-num').forEach(function(n){n.className='pair-num '+(isRight?'g':'r');});}
  });
  var card=document.getElementById('q-wrap').children[i];
  if(card)card.style.pointerEvents='none';
}

function showResults(total,max,log){
  var maxScore=TEACHER_CONFIG.maxScore||20;
  var scaled=max>0?Math.round(total/max*maxScore):0;
  var pct=max>0?Math.round(total/max*100):0;
  document.getElementById('sc-big').textContent=scaled+' / '+maxScore;
  document.getElementById('sc-label').textContent='('+total+'/'+max+' points — '+pct+'%)';
  var msg=pct>=80?'🎉 Excellent!':pct>=60?'👍 Good job!':pct>=40?'📚 Keep studying!':'💪 Try again!';
  document.getElementById('sc-msg').textContent=msg;
  document.getElementById('sc-msg').style.color=pct>=80?'#065F46':pct>=60?'#1D4ED8':'#B45309';
  document.getElementById('sc-bd').innerHTML=log.map(function(a,i){
    return'<div class="bd-item"><span class="dot '+(a.correct?'g':'r')+'"></span>'
      +'<span>Q'+(i+1)+': '+(a.correct?'Correct':'Wrong')+' — '+a.points+' pts</span></div>';
  }).join('');
  showStep('step-results');
}

function getUrl(){if(CTX.scriptUrl)return CTX.scriptUrl;if(TEACHER_CONFIG.scriptUrl)return TEACHER_CONFIG.scriptUrl;if(typeof SCRIPT_URL!=='undefined'&&SCRIPT_URL)return SCRIPT_URL;throw new Error('No scriptUrl');}
async function post(url,body){var r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body),redirect:'follow'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
function showStep(id){document.querySelectorAll('.step').forEach(function(s){s.classList.remove('active');});document.getElementById(id).classList.add('active');}
function showErr(el,msg){el.textContent=msg;el.style.display='block';}
function setLoad(id,on,label){var b=document.getElementById(id);if(!b)return;b.disabled=on;b.innerHTML=on?'<div class="spinner"></div> '+label:label;}
function goBack(){try{parent.postMessage({type:'hw_back'},'*');}catch(e){}if(window.history.length>1)window.history.back();}
function openLesson(){try{parent.postMessage({type:'open_lesson',lessonId:'L002'},'*');}catch(e){}}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

</script>
