var STATE={massar:'',pin:'',name:'',answers:[],attempt:0};

/* Build questions */
var _qOrder=null,_dispToOrig=null;
function _shuffle(arr){for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}

function buildQ(){
  var qs=TEACHER_CONFIG.questions;
  if(!_qOrder||_qOrder.length!==qs.length){_qOrder=_shuffle(qs.map(function(_,i){return i;}));}
  var orderedQs=_qOrder.map(function(i){return qs[i];});
  STATE.answers=qs.map(function(q){return q.type==='match'?new Array(q.pairs.length).fill(null):null;});
  _mcqSel={};_selA={};
  var html=orderedQs.map(function(q,dispI){
    var origI=_qOrder[dispI];
    var num='<div class="q-num">Q'+(dispI+1)+' · '+q.points+' pt'+(q.points>1?'s':'')+'</div>';
    var txt='<div class="q-text">'+esc(q.question)+'</div>';
    var hint=q.hint?'<div class="q-hint">💡 '+esc(q.hint)+'</div>':'';
    var body='';
    if(q.type==='mcq'){
      var L=['A','B','C','D'];
      var shIdx=_shuffle(q.options.map(function(_,j){return j;}));q._shIdx=shIdx;
      body='<div class="mcq-options">'+shIdx.map(function(origJ,dispJ){
        return'<div class="mcq-opt" id="mcq-'+origI+'-'+origJ+'" onclick="pickMCQ('+origI+','+origJ+')">'
          +'<span class="letter">'+L[dispJ]+'</span>'+esc(q.options[origJ])+'</div>';
      }).join('')+'</div>';
    }else if(q.type==='tf'){
      body='<div class="tf-options">'
        +'<div class="tf-opt" id="tf-'+origI+'-true" onclick="pickTF('+origI+',\'true\')">✓ True</div>'
        +'<div class="tf-opt" id="tf-'+origI+'-false" onclick="pickTF('+origI+',\'false\')">✗ False</div>'
        +'</div>';
    }else if(q.type==='fill'){
      body='<input class="fill-inp" id="fill-'+origI+'" placeholder="Type your answer…" oninput="recFill('+origI+')">';
    }else if(q.type==='match'){
      var aIdx=_shuffle(q.pairs.map(function(_,j){return j;}));
      var bItems=_shuffle(q.pairs.map(function(p,j){return{text:p.b,orig:j};}));
      q._sh=bItems;q._aIdx=aIdx;
      body='<div class="match-grid">'
        +'<div><div class="match-col-lbl">Column A</div>'
        +aIdx.map(function(origJ,dispJ){return'<div class="match-item" id="ma-'+origI+'-'+origJ+'" onclick="pickMA('+origI+','+origJ+')">'+esc(q.pairs[origJ].a)+'</div>';}).join('')
        +'</div><div><div class="match-col-lbl">Column B</div>'
        +bItems.map(function(p,j){return'<div class="match-item" id="mb-'+origI+'-'+j+'" onclick="pickMB('+origI+','+j+','+p.orig+')">'+esc(p.text)+'</div>';}).join('')

/* Pickers */
function pickMCQ(qi,oi){
  var prev=_mcqSel[qi];
  if(prev!==undefined)document.getElementById('mcq-'+qi+'-'+prev).classList.remove('sel');
  document.getElementById('mcq-'+qi+'-'+oi).classList.add('sel');
  _mcqSel[qi]=oi;STATE.answers[qi]=oi;updateProg();
}
function pickTF(qi,v){
  ['true','false'].forEach(function(x){document.getElementById('tf-'+qi+'-'+x).classList.remove('sel');});
  document.getElementById('tf-'+qi+'-'+v).classList.add('sel');
  STATE.answers[qi]=v;updateProg();
}
function recFill(qi){STATE.answers[qi]=document.getElementById('fill-'+qi).value;updateProg();}
function pickMA(qi,ai){
  var qs=TEACHER_CONFIG.questions;
  qs[qi].pairs.forEach(function(_,j){document.getElementById('ma-'+qi+'-'+j).classList.remove('sel-a');});
  document.getElementById('ma-'+qi+'-'+ai).classList.add('sel-a');_selA[qi]=ai;
}
function pickMB(qi,bi,orig){
  var ai=_selA[qi];if(ai===undefined)return;
  if(!Array.isArray(STATE.answers[qi]))STATE.answers[qi]=new Array(TEACHER_CONFIG.questions[qi].pairs.length).fill(null);
  STATE.answers[qi][ai]=orig;
  var pn=ai+1;
  var aEl=document.getElementById('ma-'+qi+'-'+ai);
  var bEl=document.getElementById('mb-'+qi+'-'+bi);
  aEl.querySelectorAll('.pair-num').forEach(function(n){n.remove();});
  bEl.querySelectorAll('.pair-num').forEach(function(n){n.remove();});
  var s1=document.createElement('span');s1.className='pair-num';s1.textContent=pn;aEl.appendChild(s1);
  var s2=document.createElement('span');s2.className='pair-num';s2.textContent=pn;bEl.appendChild(s2);
  aEl.classList.remove('sel-a');_selA[qi]=undefined;updateProg();
}

  var qs=TEACHER_CONFIG.questions;
  var done=STATE.answers.filter(function(a,i){
    if(qs[i].type==='match')return Array.isArray(a)&&a.some(function(v){return v!==null;});
    return a!==null&&a!==undefined&&a!=='';
  }).length;
  var pb=document.getElementById('pbar');if(pb)pb.style.width=Math.round(done/qs.length*100)+'%';
  var pl=document.getElementById('prog-lbl');if(pl)pl.textContent=done+' / '+qs.length+' answered';
}

/* Submit */
async function submitAll(){
  var qs=TEACHER_CONFIG.questions;
  var errEl=document.getElementById('err-bar');errEl.style.display='none';
  var unanswered=STATE.answers.filter(function(a,i){
    if(qs[i].type==='match')return!Array.isArray(a)||a.every(function(v){return v===null;});
    return a===null||a===undefined||a==='';
  }).length;
  if(unanswered>0){errEl.textContent='Please answer all '+qs.length+' questions.';errEl.style.display='block';return;}
  var totalPts=0,maxPts=0,log=[];
  qs.forEach(function(q,i){
    var pts=q.points||1;maxPts+=pts;var earned=0;var correct=false;var given=STATE.answers[i];
    if(q.type==='mcq'){correct=given===q.correct;}
    else if(q.type==='tf'){correct=String(given)===String(q.correct);}
    else if(q.type==='fill'){
      var norm=function(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ');};
      correct=norm(given)===norm(q.correct);
      if(!correct&&q.accept)correct=q.accept.some(function(a){return norm(given)===norm(a);});
    }else if(q.type==='match'){
      var pairOk=0;
      q.pairs.forEach(function(_,j){if(Array.isArray(given)&&given[j]===j)pairOk++;});
      earned=Math.round(pts*pairOk/q.pairs.length);correct=pairOk===q.pairs.length;
      totalPts+=earned;log.push({qIndex:i,type:'match',answer:given,correct:correct,points:earned});
      showFb(i,q,correct,earned,pts,given);return;
    }
    if(correct)earned=pts;
    totalPts+=earned;
    log.push({qIndex:i,type:q.type,answer:given,correct:correct,points:earned});
    showFb(i,q,correct,earned,pts,given);
  });
  var maxScore=TEACHER_CONFIG.maxScore||20;
  var scaled=maxPts>0?Math.round(totalPts/maxPts*maxScore):0;
  var pct=maxPts>0?Math.round(totalPts/maxPts*100):0;
  var btn=document.getElementById('btn-submit');
  btn.disabled=true;btn.innerHTML='<div class="spinner"></div> Sending…';
  try{
    var r=await api({
      action:'submitHomework',classId:CTX.classId||'',termId:CTX.termId||'',
      assignmentToken:TEACHER_CONFIG.assignmentToken,homeworkId:TEACHER_CONFIG.assignmentToken,
      massarCode:STATE.massar,pin:STATE.pin,
      score:scaled,maxScore:maxScore,
      timeTaken:Math.round((Date.now()-_startTime)/1000),answers:log
    });
    if(!r.ok){
      showToast('⚠ Could not save: '+(r.error||'error'));
      btn.disabled=false;btn.innerHTML='Submit Answers';
    }else{
      STATE.attempt=r.attempt||1;
      var attLeft=(r.attemptsLeft!==undefined)?r.attemptsLeft:(r.attempt>=2?0:1);
      showResult(scaled,maxScore,r.attempt||1,attLeft,pct);
      try{parent.postMessage({type:'hw_submitted',score:scaled,maxScore:maxScore,assignmentToken:TEACHER_CONFIG.assignmentToken},'*');}catch(e){}
    }
  }catch(e){
    showToast('⚠ Connection failed. Answers not saved.');
    btn.disabled=false;btn.innerHTML='Submit Answers';
  }
}

function showFb(i,q,correct,earned,pts,given){
  var fb=document.getElementById('fb-'+i);if(!fb)return;
  fb.className='q-fb '+(correct?'ok':'bad');
  var msg=correct?'✓ Correct! (+'+earned+' pt'+(pts>1?'s':'')+')'
    :'✗ Incorrect. Answer: "'+q.correct+'".';
  if(!correct&&q.explanation)msg+=' — '+q.explanation;
  fb.textContent=msg;fb.style.display='block';
  if(q.type==='mcq'){
    if(given!==null&&given!==undefined)document.getElementById('mcq-'+i+'-'+given).classList.add(correct?'ok':'bad');
    if(!correct&&document.getElementById('mcq-'+i+'-'+q.correct))document.getElementById('mcq-'+i+'-'+q.correct).classList.add('ok');
  }else if(q.type==='tf'){
    if(given)document.getElementById('tf-'+i+'-'+given).classList.add(correct?'ok':'bad');
    if(!correct)document.getElementById('tf-'+i+'-'+q.correct).classList.add('ok');
  }else if(q.type==='fill'){
    var el=document.getElementById('fill-'+i);if(el)el.classList.add(correct?'ok':'bad');
  }else if(q.type==='match'){
    q.pairs.forEach(function(_,j){
      var isOk=Array.isArray(given)&&given[j]===j;
      var aEl=document.getElementById('ma-'+i+'-'+j);
      if(aEl){aEl.classList.add(isOk?'matched':'wrong-m');aEl.querySelectorAll('.pair-num').forEach(function(n){n.className='pair-num '+(isOk?'g':'r');});}
    });
  }
  var card=document.getElementById('qc-'+i);if(card)card.style.pointerEvents='none';
}

function showResult(score,maxScore,attempt,attLeft,pct){
  var emoji=pct>=80?'🎉':pct>=60?'👍':pct>=40?'📚':'💪';
  var msg=pct>=80?'Excellent!':pct>=60?'Good job!':pct>=40?'Keep studying!':'Try again!';
  var col=pct>=80?'#065F46':pct>=60?'#1D4ED8':'#B45309';
  var attHtml=attLeft>0
    ?'<div class="att-badge att-more">🔄 You have 1 more attempt</div>'
    :'<div class="att-badge att-done">✅ Homework completed</div>';
  var actHtml=attLeft>0
    ?'<button class="btn-retry" onclick="doRetry()">Try again (final attempt)</button>'
    :'<button class="btn-done" disabled>✅ No more attempts — thank you!</button>';
  var mc=document.getElementById('main-content');
  mc.innerHTML='<div class="result-card">'
    +'<div class="res-score" style="color:'+col+'">'+score+'</div>'
    +'<div class="res-max">/ '+maxScore+' points</div>'
    +'<div class="res-msg">'+emoji+' '+msg+'</div>'
    +'<div class="res-pct">'+pct+'% · Attempt '+attempt+' of 2</div>'
    +attHtml
    +'<div style="height:1px;background:#F2F1EE;margin:16px 0;"></div>'
    +actHtml
    +'<button class="btn-ghost" onclick="goBack()">← Back to portal</button>'
    +'</div>';
}

function doRetry(){
  var mc=document.getElementById('main-content');
  mc.innerHTML=
    '<div class="verified-bar" id="verified-bar" style="display:flex;">'
    +'<span>✅</span><span class="name">'+STATE.name+'</span></div>'
    +'<div class="err-bar" id="err-bar"></div>'
    +'<div class="questions" id="q-wrap"></div>'
    +'<div class="progress" id="prog-wrap" style="display:none;"><div class="pbar" id="pbar"></div></div>'
    +'<div class="prog-lbl" id="prog-lbl"></div>'
    +'<div class="action-bar" id="action-bar" style="display:none;">'
    +'<button class="btn-save" onclick="saveDraft()">💾 Save Draft</button>'
    +'<button class="btn-clear" onclick="clearAll()">✕ Clear</button></div>'
    +'<button class="btn-submit" id="btn-submit" onclick="submitAll()">Submit Final Answers</button>'
    +'<button class="btn-ghost" id="btn-goback" onclick="goBack()">← Back to portal</button>';
  _qOrder=null;buildQ();window.scrollTo(0,0);
  showToast('📝 Final attempt — this is your last chance!');
}

/* Draft */
function checkDraft(){
  if(!STATE.massar)return;
  api({action:'getDraft',massarCode:STATE.massar,assignmentToken:TEACHER_CONFIG.assignmentToken})
  .then(function(r){
    if(r.ok&&r.draft&&r.draft.answers){
      _draft=r.draft;
      var db=document.getElementById('draft-banner');
      if(db){
        var d=new Date(r.draft.savedAt);
        db.querySelector('.info').textContent='💾 Saved: '+d.toLocaleDateString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
        db.style.display='flex';
      }
    }
  }).catch(function(){});
}

function resumeDraft(){
  if(!_draft||!_draft.answers)return;
  _draft.answers.forEach(function(saved,i){
    var q=TEACHER_CONFIG.questions[i];if(!q||saved===null||saved===undefined)return;
    if(q.type==='mcq'&&saved!==null)pickMCQ(i,saved);
    else if(q.type==='tf'&&saved)pickTF(i,String(saved));
    else if(q.type==='fill'){var el=document.getElementById('fill-'+i);if(el){el.value=saved||'';STATE.answers[i]=saved;}}
  });
  var db=document.getElementById('draft-banner');if(db)db.style.display='none';
  updateProg();showToast('✅ Previous answers restored!');
}

function saveDraft(){
  api({action:'saveDraft',massarCode:STATE.massar||CTX.massarCode,
    assignmentToken:TEACHER_CONFIG.assignmentToken,answers:STATE.answers||[]})
  .then(function(r){
    showToast(r.ok?'💾 Draft saved! Come back anytime.':'⚠ Could not save draft.');
  }).catch(function(){showToast('⚠ Could not save draft.');});
}

function clearAll(){
  if(!confirm('Clear all your answers and start fresh?'))return;
  buildQ();showToast('✕ Answers cleared.');
}

/* Toast */
function showToast(msg){
  var t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(function(){t.remove();},4000);
}

/* Navigation */
function goBack(){
  if(window.history.length>1)window.history.back();
  else{try{var p=Object.fromEntries(new URLSearchParams(location.hash.slice(1)));if(p.scriptUrl)window.location.href=p.scriptUrl;}catch(e){}}
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
