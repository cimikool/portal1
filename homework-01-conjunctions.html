  questions: [
    {
      type: 'mcq',
      question: 'Choose the correct conjunction: "I was tired ___ I went to bed early."',
      options: ['and', 'but', 'so', 'because'],
      correct: 2,
      points: 2,
      explanation: '"So" introduces the result of being tired.',
    },
    {
      type: 'mcq',
      question: 'Choose the correct conjunction: "She likes drawing ___ she doesn\'t like painting."',
      options: ['and', 'but', 'so', 'because'],
      correct: 1,
      points: 2,
      explanation: '"But" shows a contrast between two opposite ideas.',
    },
    {
      type: 'mcq',
      question: 'Choose the correct conjunction: "He studies hard ___ he wants to pass his exams."',
      options: ['and', 'but', 'so', 'because'],
      correct: 3,
      points: 2,
      explanation: '"Because" introduces the reason for studying hard.',
    },
    {
      type: 'mcq',
      question: 'Choose the correct conjunction: "Morocco has beautiful mountains ___ beautiful beaches."',
      options: ['and', 'but', 'so', 'because'],
      correct: 0,
      points: 2,
      explanation: '"And" adds two positive things together.',
    },
    {
      type: 'tf',
      question: '"Because" introduces the RESULT of an action (what happens after).',
      correct: 'false',
      points: 2,
      explanation: '"Because" introduces the REASON. "So" introduces the result.',
    },
    {
      type: 'tf',
      question: 'The sentence "It was raining, so we stayed inside." is grammatically correct.',
      correct: 'true',
      points: 2,
      explanation: 'Correct! "So" correctly shows the result of the rain.',
    },
    {
      type: 'fill',
      question: 'Complete with the correct conjunction: "I love football ___ I play every day."',
      correct: 'because',
      accept: ['so'],
      points: 2,
      hint: 'Think: is this a reason or a result?',
      explanation: '"because" (reason: I play because I love it) or "so" is also accepted (result: I love it so I play).',
    },
    {
      type: 'fill',
      question: 'Complete: "The weather was cold ___ sunny at the same time."',
      correct: 'but',
      points: 2,
      hint: 'Two contrasting ideas.',
      explanation: '"But" is used to connect two contrasting ideas.',
    },
    {
      type: 'mcq',
      question: 'Which sentence uses "because" correctly?',
      options: [
        'I was late because I missed the bus.',
        'I was late because I arrived early.',
        'I missed the bus because I was late.',
        'Because I was late so I missed the bus.',
      ],
      correct: 0,
      points: 2,
      explanation: 'Option A is correct: "because" connects the result (late) to its reason (missed the bus).',
    },
    {
      type: 'mcq',
      question: 'Complete: "She is a good artist. She practises every day." → (one sentence)',
      options: [
        'She is a good artist but she practises every day.',
        'She is a good artist because she practises every day.',
        'She is a good artist so she practises every day.',
        'She practises every day and she is not a good artist.',
      ],
      correct: 1,
      points: 2,
      explanation: 'Practising every day is the REASON she is a good artist → "because".',
    },
  ],
};

<script>
var CTX={};
try{var h=location.hash.slice(1);if(h)CTX=Object.fromEntries(new URLSearchParams(h));}catch(e){}


var STATE={massar:'',pin:'',name:'',answers:[]};
var _startTime=Date.now();

async function verify(){
  var massar=document.getElementById('massar').value.trim();
  var pin=document.getElementById('pin').value.trim();
  var err=document.getElementById('login-error');
  err.style.display='none';
  if(!massar){showErr(err,'Please enter your Massar number.');return;}
  if(!pin||pin.length!==4){showErr(err,'Please enter your 4-digit PIN.');return;}
  setLoad('btn-verify',true,'Verifying…');
  try{
    var r=await post(getUrl(),{action:'verifyStudent',massarCode:massar,classId:CTX.classId||'',
      pin:pin,homeworkId:TEACHER_CONFIG.assignmentToken});
    if(!r.ok){showErr(err,r.error||'Incorrect details.');return;}
    STATE.massar=massar;STATE.pin=pin;STATE.name=r.studentName||massar;
    document.getElementById('verified-name').textContent=STATE.name;
    showStep('step-questions');buildQuestions();
  }catch(e){showErr(err,'Connection failed. Check your internet.');}
  finally{setLoad('btn-verify',false,'Start Homework');}
}

function buildQuestions(){
  var qs=TEACHER_CONFIG.questions;
  STATE.answers=new Array(qs.length).fill(null);
  var html=qs.map(function(q,i){
    var num='<div class="q-num">Question '+(i+1)+' · '+q.points+' pt'+(q.points>1?'s':'')+'</div>';
    var txt='<div class="q-text">'+esc(q.question)+'</div>';
    var hint=q.hint?'<div class="q-hint">💡 '+esc(q.hint)+'</div>':'';
    var body='';
    if(q.type==='mcq'){
      var letters=['A','B','C','D'];
      body='<div class="mcq-options">'+q.options.map(function(o,j){
        return'<div class="mcq-opt" id="mcq-'+i+'-'+j+'" onclick="pickMCQ('+i+','+j+')">'
          +'<span class="letter">'+letters[j]+'</span>'+esc(o)+'</div>';
      }).join('')+'</div>';
    }else if(q.type==='tf'){
      body='<div class="tf-options">'
        +'<div class="tf-opt" id="tf-'+i+'-true" onclick="pickTF('+i+',\'true\')">✓ True</div>'
        +'<div class="tf-opt" id="tf-'+i+'-false" onclick="pickTF('+i+',\'false\')">✗ False</div>'
        +'</div>';
    }else if(q.type==='fill'){
      body='<input class="fill-inp" id="fill-'+i+'" placeholder="Type the conjunction…" oninput="recordFill('+i+')">';
    }
    return'<div class="q-card">'+num+txt+hint+body+'<div class="q-feedback" id="fb-'+i+'"></div></div>';
  }).join('');
  document.getElementById('q-wrap').innerHTML=html;
  updateProg();
}

var _mcq={};
function pickMCQ(qi,oi){
  var prev=_mcq[qi];
  if(prev!==undefined)document.getElementById('mcq-'+qi+'-'+prev).classList.remove('selected');
  document.getElementById('mcq-'+qi+'-'+oi).classList.add('selected');
  _mcq[qi]=oi;STATE.answers[qi]=oi;updateProg();
}
function pickTF(qi,v){
  ['true','false'].forEach(function(x){document.getElementById('tf-'+qi+'-'+x).classList.remove('selected');});
  document.getElementById('tf-'+qi+'-'+v).classList.add('selected');
  STATE.answers[qi]=v;updateProg();
}
function recordFill(qi){STATE.answers[qi]=document.getElementById('fill-'+qi).value;updateProg();}
function updateProg(){
  var done=STATE.answers.filter(function(a){return a!==null&&a!==undefined&&a!=='';}).length;
  var total=TEACHER_CONFIG.questions.length;
  document.getElementById('pbar').style.width=Math.round(done/total*100)+'%';
  document.getElementById('plabel').textContent=done+' / '+total+' answered';
}

async function submitAll(){
  var qs=TEACHER_CONFIG.questions;
  var err=document.getElementById('submit-error');err.style.display='none';
  var unans=STATE.answers.filter(function(a){return a===null||a===undefined||a==='';}).length;
  if(unans>0){showErr(err,'Please answer all '+qs.length+' questions first.');return;}
  var totalPts=0,maxPts=0,log=[];
  qs.forEach(function(q,i){
    var pts=q.points||1;maxPts+=pts;var correct=false;var earned=0;var given=STATE.answers[i];
    if(q.type==='mcq'){correct=given===q.correct;}
    else if(q.type==='tf'){correct=String(given)===String(q.correct);}
    else if(q.type==='fill'){
      var norm=function(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ');};
      correct=norm(given)===norm(q.correct);
      if(!correct&&q.accept)correct=q.accept.some(function(a){return norm(given)===norm(a);});
    }
    if(correct)earned=pts;
    totalPts+=earned;
    log.push({qIndex:i,type:q.type,answer:given,correct:correct,points:earned});
    showFeedback(i,q,correct,earned,pts,given);
  });
  showResults(totalPts,maxPts,log);
  var maxScore=TEACHER_CONFIG.maxScore||20;
  var scaled=maxPts>0?Math.round(totalPts/maxPts*maxScore):0;
  setLoad('btn-submit',true,'Sending…');
  try{
    var r=await post(getUrl(),{
      action:'submitHomework',classId:CTX.classId||'',termId:CTX.termId||'',
      assignmentToken:TEACHER_CONFIG.assignmentToken,homeworkId:TEACHER_CONFIG.assignmentToken,
      massarCode:STATE.massar,pin:STATE.pin,
      score:scaled,maxScore:maxScore,
      timeTaken:Math.round((Date.now()-_startTime)/1000),answers:log
    });
    if(!r.ok)document.getElementById('sc-label').textContent+=' (⚠ Not saved: '+(r.error||'error')+')';
    else{
      try{
      var target = window.opener || window.parent;
      target.postMessage({type:'hw_submitted',score:scaled,maxScore:maxScore,
        assignmentToken:TEACHER_CONFIG.assignmentToken},'*');
      setTimeout(function(){ window.close(); }, 3000);
    }catch(e){}
    }
  }catch(e){document.getElementById('sc-label').textContent+=' (⚠ Not saved — no internet)';}
  finally{setLoad('btn-submit',false,'Submit Answers');}
}

function showFeedback(i,q,correct,earned,pts,given){
  var fb=document.getElementById('fb-'+i);
  if(!fb)return;
  fb.className='q-feedback '+(correct?'correct':'wrong');
  var msg=correct?'✓ Correct! (+'+earned+' pt'+(pts>1?'s':'')+')'
    :'✗ Incorrect. The answer is "'+q.correct+'".';
  if(!correct&&q.explanation)msg+=' — '+q.explanation;
  fb.textContent=msg;fb.style.display='block';
  if(q.type==='mcq'){
    if(given!==null)document.getElementById('mcq-'+i+'-'+given).classList.add(correct?'correct':'wrong');
    if(!correct)document.getElementById('mcq-'+i+'-'+q.correct).classList.add('correct');
  }else if(q.type==='tf'){
    if(given)document.getElementById('tf-'+i+'-'+given).classList.add(correct?'correct':'wrong');
    if(!correct)document.getElementById('tf-'+i+'-'+q.correct).classList.add('correct');
  }else if(q.type==='fill'){
    document.getElementById('fill-'+i).classList.add(correct?'correct':'wrong');
  }
  var card=document.getElementById('q-wrap').children[i];
  if(card){card.style.pointerEvents='none';}
}

function showResults(total,max,log){
  var maxScore=TEACHER_CONFIG.maxScore||20;
  var scaled=max>0?Math.round(total/max*maxScore):0;
  var pct=max>0?Math.round(total/max*100):0;
  document.getElementById('sc-big').textContent=scaled+' / '+maxScore;
  document.getElementById('sc-label').textContent='('+total+'/'+max+' points — '+pct+'%)';
  var msg=pct>=80?'🎉 Excellent!':pct>=60?'👍 Good job!':pct>=40?'📚 Keep studying!':'💪 Try again!';
  var col=pct>=80?'#065F46':pct>=60?'#1D4ED8':'#B45309';
  document.getElementById('sc-msg').textContent=msg;
  document.getElementById('sc-msg').style.color=col;
  document.getElementById('sc-bd').innerHTML=log.map(function(a,i){
    return'<div class="bd-item"><span class="dot '+(a.correct?'g':'r')+'"></span>'
      +'<span>Q'+(i+1)+': '+(a.correct?'Correct':'Wrong')+' — '+a.points+' pts</span></div>';
  }).join('');
  showStep('step-results');
}

function getUrl(){
  if(CTX.scriptUrl)return CTX.scriptUrl;
  if(TEACHER_CONFIG.scriptUrl)return TEACHER_CONFIG.scriptUrl;
  if(typeof SCRIPT_URL!=='undefined'&&SCRIPT_URL)return SCRIPT_URL;
  throw new Error('No scriptUrl');
}
async function post(url,body){
  var r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body),redirect:'follow'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}
function showStep(id){document.querySelectorAll('.step').forEach(function(s){s.classList.remove('active');});document.getElementById(id).classList.add('active');}
function showErr(el,msg){el.textContent=msg;el.style.display='block';}
function setLoad(id,on,label){var b=document.getElementById(id);if(!b)return;b.disabled=on;b.innerHTML=on?'<div class="spinner"></div> '+label:label;}
function goBack(){try{parent.postMessage({type:'hw_back'},'*');}catch(e){}if(window.history.length>1)window.history.back();}
function openLesson(){try{parent.postMessage({type:'open_lesson',lessonId:'L001'},'*');}catch(e){}}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

<script>
/* ── Init: runs after all scripts loaded ── */
window.addEventListener('load', function() {
  /* Fill header info */
  var tag = document.getElementById('student-tag');
  if (tag && CTX.studentName) { tag.textContent = '👤 ' + CTX.studentName; tag.style.display = 'inline'; }
  var due = document.getElementById('hw-due');
  if (due && TEACHER_CONFIG.dueDate) due.textContent = 'Due: ' + TEACHER_CONFIG.dueDate;

  /* Set student identity if passed from container */
  if (CTX.massarCode) {
    STATE.massar = CTX.massarCode;
    STATE.pin    = CTX.pin || '';
    STATE.name   = CTX.studentName || CTX.massarCode;
    var vn = document.getElementById('verified-name');
    if (vn) vn.textContent = STATE.name;
  }

  /* Always build questions — with or without credentials */
  buildQuestions();
  updateProg();
});
</script>
