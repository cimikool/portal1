<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Learning Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --card:#fff; --ink:#1c1b18; --muted:#8a867c; --line:#e6e2d8;
  --brand:#3f46c7; --ok:#0f9d58; --warn:#b45309; --danger:#b91c1c;
}
*{box-sizing:border-box} html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Cairo',sans-serif}
body{min-height:100vh}
#app{max-width:980px;margin:0 auto;padding:16px}
.hdr{background:#1c1b18;color:#fff;border-radius:16px;padding:18px 20px;margin-bottom:14px}
.hdr h1{margin:0;font-size:1.05rem}
.hdr .sub{opacity:.65;font-size:.78rem;margin-top:2px}
.meta{margin-top:10px;font-size:.8rem;opacity:.82}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.login{max-width:420px;margin:42px auto}
label{display:block;margin:0 0 6px;font-weight:700;font-size:.84rem}
input{width:100%;padding:12px 14px;border:1px solid #d8d2c5;background:#f9f8f5;border-radius:12px;font:inherit;margin-bottom:12px}
button{font:inherit;cursor:pointer}
.btn{border:none;background:var(--brand);color:#fff;padding:12px 14px;border-radius:12px;font-weight:700}
.btn.secondary{background:#efede6;color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.err{display:none;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:10px 12px;border-radius:12px;margin-bottom:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.muted{color:var(--muted)}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.unit{padding:16px;cursor:pointer}
.unit h3{margin:0 0 6px;font-size:1rem}
.stats{font-size:.8rem;color:var(--muted)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;background:#efede6;font-size:.75rem;font-weight:700;margin-top:8px}
.badge.ok{background:#dcfce7;color:#166534}
.badge.warn{background:#fef3c7;color:#92400e}
.tabs{display:flex;gap:8px;margin:12px 0}
.tab{flex:1;border:none;border-radius:12px;padding:10px;background:#efede6;color:var(--ink);font-weight:700}
.tab.active{background:var(--ink);color:#fff}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:flex-start;padding:14px}
.item .num{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#1c1b18;color:#fff;font-weight:700;flex-shrink:0}
.item .body{flex:1;min-width:0}
.item .title{font-weight:700}
.item .meta2{font-size:.78rem;color:var(--muted);margin-top:4px}
.item.locked{opacity:.58}
.item.locked .num{background:#8d8b84}
.score{background:#dcfce7;color:#166534;border-radius:999px;padding:4px 10px;font-size:.76rem;font-weight:700;white-space:nowrap}
.link{border:none;background:none;color:var(--brand);padding:0;font-weight:700}
.back{margin-bottom:10px}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (max-width:640px){#app{padding:12px}.row{flex-direction:column}}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <h1>🎓 Learning Portal</h1>
    <div class="sub" id="hdr-sub">Login to access your lessons and homework</div>
    <div class="meta" id="hdr-meta" style="display:none"></div>
  </div>

  <div id="login-screen" class="card login">
    <div id="login-err" class="err"></div>
    <label>Massar Number</label>
    <input id="massar" placeholder="e.g. N130032465" autocomplete="off">
    <label>PIN</label>
    <input id="pin" type="password" maxlength="4" placeholder="••••" inputmode="numeric">
    <button class="btn" id="login-btn" onclick="doLogin()">Sign in</button>
  </div>

  <div id="main-screen" style="display:none">
    <div class="toolbar">
      <div>
        <div id="student-name" style="font-weight:700"></div>
        <div id="student-line" class="muted"></div>
      </div>
      <div class="row">
        <button class="btn secondary" onclick="refreshPortal(true)">Refresh</button>
        <button class="btn secondary" onclick="logout()">Sign out</button>
      </div>
    </div>

    <div id="view-units"></div>

    <div id="view-unit" style="display:none">
      <button class="btn secondary back" onclick="showUnits()">← Units</button>
      <div class="card">
        <div id="unit-title" style="font-weight:700;font-size:1rem"></div>
        <div id="unit-stats" class="muted" style="margin-top:4px"></div>
        <div class="tabs">
          <button class="tab active" id="tab-lessons" onclick="setTab('lessons')">Lessons</button>
          <button class="tab" id="tab-homework" onclick="setTab('homework')">Homework</button>
        </div>
        <div id="unit-list"></div>
      </div>
    </div>
  </div>
</div>

<script>
const SCRIPT_URL = 'PASTE_YOUR_WEBAPP_URL_HERE';
const APP_SECRET = '';

let SESSION = null;
let PORTAL = null;
let ACTIVE_UNIT = null;
let ACTIVE_TAB = 'lessons';
let LOAD_BUSY = false;

const ls = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};

function withSecret(obj){ if (APP_SECRET) obj.secret = APP_SECRET; return obj; }

async function api(body){
  const res = await fetch(SCRIPT_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain'},
    body: JSON.stringify(withSecret(body))
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function saveSession(){ sessionStorage.setItem('lp_core_session', JSON.stringify(SESSION)); }
function loadSession(){ try { return JSON.parse(sessionStorage.getItem('lp_core_session') || 'null'); } catch { return null; } }
function clearSession(){ sessionStorage.removeItem('lp_core_session'); }

async function doLogin(){
  const massar = document.getElementById('massar').value.trim();
  const pin = document.getElementById('pin').value.trim();
  const err = document.getElementById('login-err');
  err.style.display = 'none';
  if (!massar) return showErr('Please enter your Massar number');
  if (!pin) return showErr('Please enter your PIN');

  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Signing in...';

  try {
    const r = await api({ action:'loginContainer', massarCode:massar, pin });
    if (!r.ok) return showErr(r.error || 'Login failed');
    SESSION = {
      studentName: r.studentName,
      massarCode: r.massarCode,
      classId: r.classId,
      className: r.className || r.classId,
      termId: r.termId || 's1',
      studentId: r.studentId || ''
    };
    saveSession();
    enterApp();
  } catch(e) {
    showErr('Connection failed');
  } finally {
    btn.disabled = false; btn.textContent = 'Sign in';
  }
}

function showErr(msg){
  const err = document.getElementById('login-err');
  err.textContent = msg;
  err.style.display = 'block';
}

function enterApp(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'block';
  document.getElementById('hdr-sub').style.display = 'none';
  document.getElementById('hdr-meta').style.display = 'block';
  document.getElementById('hdr-meta').textContent = SESSION.studentName + ' · ' + SESSION.className;
  document.getElementById('student-name').textContent = SESSION.studentName;
  document.getElementById('student-line').textContent = SESSION.className + ' · ' + SESSION.massarCode;
  refreshPortal(true);
}

async function refreshPortal(force){
  if (!SESSION || LOAD_BUSY) return;
  LOAD_BUSY = true;
  try{
    const r = await api({
      action:'getPortalData',
      classId: SESSION.classId,
      termId: SESSION.termId,
      massarCode: SESSION.massarCode
    });
    if (!r.ok) throw new Error(r.error || 'Failed to load');
    PORTAL = r;
    console.log('portal version:', r.version);
    render();
  } catch(e){
    document.getElementById('view-units').innerHTML = '<div class="card empty">Failed to load portal data.</div>';
  } finally {
    LOAD_BUSY = false;
  }
}

function render(){
  if (!PORTAL) return;
  if (ACTIVE_UNIT) renderUnit();
  else showUnits();
}

function showUnits(){
  ACTIVE_UNIT = null;
  document.getElementById('view-unit').style.display = 'none';
  const wrap = document.getElementById('view-units');
  const units = (PORTAL.units || []);
  if (!units.length){
    wrap.innerHTML = '<div class="card empty">No content available yet.</div>';
    return;
  }
  let total = PORTAL.totalScore || {score:0,maxScore:0};
  let html = '<div class="row" style="margin-bottom:12px"><div class="card" style="flex:1"><div class="muted">Total homework score</div><div style="font-size:1.2rem;font-weight:700">' + total.score + ' / ' + total.maxScore + '</div></div></div>';
  html += '<div class="units">';
  units.forEach(u => {
    const doneL = u.stats ? u.stats.lessonsUnlocked : 0;
    const totalL = u.stats ? u.stats.lessonsTotal : 0;
    const doneH = u.stats ? u.stats.homeworkDone : 0;
    const totalH = u.stats ? u.stats.homeworkTotal : 0;
    let badge = '<span class="badge">Start</span>';
    if (totalL && doneL === totalL && doneH === totalH) badge = '<span class="badge ok">Complete</span>';
    else if (doneL || doneH) badge = '<span class="badge warn">In progress</span>';

    html += '<div class="card unit" onclick="openUnit(\'' + esc(u.key) + '\')">' +
      '<h3>' + esc(u.emoji + ' ' + u.label) + '</h3>' +
      '<div class="stats">' + doneL + '/' + totalL + ' lessons unlocked · ' + doneH + '/' + totalH + ' homework done</div>' +
      badge +
    '</div>';
  });
  html += '</div>';
  wrap.innerHTML = html;
}

function openUnit(key){
  ACTIVE_UNIT = key;
  ACTIVE_TAB = 'lessons';
  renderUnit();
}

function renderUnit(){
  const unit = (PORTAL.units || []).find(u => u.key === ACTIVE_UNIT);
  if (!unit) return showUnits();
  document.getElementById('view-units').innerHTML = '';
  document.getElementById('view-unit').style.display = 'block';
  document.getElementById('unit-title').textContent = unit.emoji + ' ' + unit.label;
  document.getElementById('unit-stats').textContent =
    (unit.stats.lessonsUnlocked || 0) + '/' + (unit.stats.lessonsTotal || 0) + ' lessons unlocked · ' +
    (unit.stats.homeworkDone || 0) + '/' + (unit.stats.homeworkTotal || 0) + ' homework done';
  document.getElementById('tab-lessons').classList.toggle('active', ACTIVE_TAB === 'lessons');
  document.getElementById('tab-homework').classList.toggle('active', ACTIVE_TAB === 'homework');
  renderUnitList(unit);
}

function setTab(tab){
  ACTIVE_TAB = tab;
  renderUnit();
}

function renderUnitList(unit){
  const list = document.getElementById('unit-list');
  const items = ACTIVE_TAB === 'lessons' ? (unit.lessons || []) : (unit.homework || []);
  if (!items.length){
    list.innerHTML = '<div class="empty">No items in this section.</div>';
    return;
  }
  let html = '<div class="list">';
  items.forEach(item => {
    const locked = !!item.locked;
    const sub = item.submission;
    const num = ACTIVE_TAB === 'lessons' ? (item.lessonNumber || '→') : (sub ? '✅' : '📝');
    const meta = ACTIVE_TAB === 'lessons'
      ? ((item.passed ? 'Passed activity' : 'Activity not passed yet') + (item.createdAt ? ' · ' + fmtDate(item.createdAt) : ''))
      : (((item.linkedLessons && item.linkedLessons[0]) ? ('Linked to lesson ' + (item.linkedLessons[0].lessonNumber || '')) : '') + (sub ? (' · Submitted ' + sub.score + '/' + sub.maxScore) : ''));
    const action = locked ? "showToast('Locked')" : "openContent('" + ACTIVE_TAB.slice(0,-1) + "','" + esc(item.id) + "')";
    html += '<div class="card item' + (locked ? ' locked' : '') + '" onclick="' + action + '">' +
      '<div class="num">' + esc(num) + '</div>' +
      '<div class="body"><div class="title">' + esc(item.title) + '</div><div class="meta2">' + esc(meta) + '</div></div>' +
      (sub ? '<div class="score">' + sub.score + ' / ' + sub.maxScore + '</div>' : '') +
    '</div>';
  });
  html += '</div>';
  list.innerHTML = html;
}

function submissionKey(item){ return item.assignmentToken || item.id; }

function openContent(type,id){
  const unit = (PORTAL.units || []).find(u => u.key === ACTIVE_UNIT);
  const items = type === 'lesson' ? (unit.lessons || []) : (unit.homework || []);
  const item = items.find(x => x.id === id);
  if (!item || !item.fileUrl) return alert('File not available');
  if (item.locked) return showToast('Locked');

  ls.set('lp_core_return_unit', ACTIVE_UNIT);
  ls.set('lp_core_return_tab', ACTIVE_TAB);
  ls.set('lp_core_refresh', '1');

  const params = new URLSearchParams({
    scriptUrl: SCRIPT_URL,
    secret: APP_SECRET,
    classId: SESSION.classId,
    termId: SESSION.termId,
    massarCode: SESSION.massarCode,
    studentName: SESSION.studentName,
    studentId: SESSION.studentId || '',
    contentType: type,
    contentId: item.id,
    lessonId: type === 'lesson' ? item.id : ((item.linkedLessons && item.linkedLessons[0] && item.linkedLessons[0].id) || ''),
    homeworkId: type === 'homework' ? item.id : '',
    assignmentToken: type === 'homework' ? (item.assignmentToken || '') : '',
    lessonNumber: item.lessonNumber || '',
    lessonTitle: item.title || ''
  });
  window.location.href = item.fileUrl + '#' + params.toString();
}

function showToast(msg){ alert(msg); }

function logout(){
  clearSession();
  SESSION = null;
  PORTAL = null;
  ACTIVE_UNIT = null;
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'block';
  document.getElementById('hdr-sub').style.display = 'block';
  document.getElementById('hdr-meta').style.display = 'none';
}

function esc(s){ return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(s){ try { return new Date(s).toLocaleDateString('en-GB'); } catch { return ''; } }

(function init(){
  const s = loadSession();
  if (!s) return;
  SESSION = s;
  ACTIVE_UNIT = ls.get('lp_core_return_unit') || null;
  ACTIVE_TAB = ls.get('lp_core_return_tab') || 'lessons';
  ls.del('lp_core_return_unit');
  ls.del('lp_core_return_tab');
  enterApp();
}());

window.addEventListener('pageshow', function(){
  if (SESSION && ls.get('lp_core_refresh')) {
    ls.del('lp_core_refresh');
    refreshPortal(true);
  }
});
window.addEventListener('focus', function(){
  if (SESSION && ls.get('lp_core_refresh')) {
    ls.del('lp_core_refresh');
    refreshPortal(true);
  }
});
</script>
</body>
</html>
