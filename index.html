<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Learning Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ── Reset ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Cairo',sans-serif;background:#F5F4F0;color:#1A1917;-webkit-text-size-adjust:100%;}
body{min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden;}

/* ── Layout ── */
#app{flex:1;display:flex;flex-direction:column;width:100%;max-width:640px;margin:0 auto;padding:12px;}

/* ── Header ── */
.hdr{background:#1C1B18;color:#fff;border-radius:14px;padding:16px 20px;margin-bottom:12px;}
.hdr-title{font-size:.95rem;font-weight:700;}
.hdr-sub{font-size:.72rem;opacity:.5;}
.school-row{font-size:.72rem;opacity:.6;margin-top:4px;line-height:1.6;}

/* ── Student bar ── */
.sbar{border-top:1px solid rgba(255,255,255,.12);margin-top:10px;padding-top:10px;display:none;}
.sbar-mini{display:flex;align-items:center;justify-content:space-between;}
.sbar-name{font-size:.85rem;font-weight:700;}
.sbar-cls{font-size:.7rem;opacity:.5;margin-top:1px;}
.sbar-btn{background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.7);border-radius:8px;padding:4px 10px;font-size:.72rem;font-weight:600;cursor:pointer;font-family:'Cairo',sans-serif;}
.sbar-btn:hover{background:rgba(255,255,255,.18);}
.sbar-body{margin-top:10px;}
.sbar-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;}
.sf{background:rgba(255,255,255,.07);border-radius:8px;padding:7px 10px;}
.sf.full{grid-column:1/-1;}
.sf-lbl{font-size:.65rem;opacity:.5;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;}
.sf-val{font-size:.82rem;font-weight:700;}
.score-bar{background:rgba(255,255,255,.1);border-radius:10px;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.score-lbl{font-size:.72rem;opacity:.6;}
.score-val{font-size:1.2rem;font-weight:700;color:#86EFAC;}
.logout-btn{width:100%;background:rgba(255,255,255,.08);border:none;color:rgba(255,255,255,.6);border-radius:8px;padding:7px;font-size:.75rem;font-weight:600;cursor:pointer;font-family:'Cairo',sans-serif;}
.logout-btn:hover{background:rgba(255,255,255,.15);}

/* ── Screens ── */
#login-screen{display:flex;flex-direction:column;justify-content:center;min-height:60dvh;}
#main-screen{display:none;flex:1;flex-direction:column;}

/* ── Login form ── */
.login-card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.08);}
.login-title{font-size:1.05rem;font-weight:700;margin-bottom:4px;}
.login-sub{font-size:.78rem;color:#9CA3AF;margin-bottom:20px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:.78rem;font-weight:600;color:#374151;margin-bottom:6px;}
.field input{width:100%;border:1.5px solid #E5E3DE;border-radius:10px;padding:11px 14px;font-size:.9rem;font-family:'Cairo',sans-serif;outline:none;transition:border .15s;}
.field input:focus{border-color:#4338CA;}
.login-btn{width:100%;background:#4338CA;color:#fff;border:none;border-radius:11px;padding:13px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;margin-top:4px;transition:background .15s;}
.login-btn:hover{background:#3730A3;}
.login-btn:disabled{background:#9CA3AF;cursor:not-allowed;}
.err-msg{background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:10px 14px;font-size:.82rem;color:#991B1B;margin-top:10px;display:none;}
.login-school{font-size:.72rem;color:#9CA3AF;text-align:center;margin-top:10px;}

/* ── Tabs ── */
.tabs{display:flex;gap:6px;margin-bottom:14px;}
.tab{flex:1;background:#fff;border:1.5px solid #E5E3DE;border-radius:10px;padding:9px;font-size:.82rem;font-weight:600;cursor:pointer;font-family:'Cairo',sans-serif;text-align:center;transition:all .15s;color:#6B7280;}
.tab.active{background:#4338CA;border-color:#4338CA;color:#fff;}
.back-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.back-btn{background:#fff;border:1.5px solid #E5E3DE;border-radius:10px;padding:8px 14px;font-size:.82rem;font-weight:600;cursor:pointer;font-family:'Cairo',sans-serif;}
.back-btn:hover{background:#F5F4F0;}
.unit-name{font-size:.9rem;font-weight:700;color:#1A1917;}
.refresh-btn{width:100%;background:none;border:1.5px dashed #D1D5DB;border-radius:10px;padding:10px;font-size:.8rem;color:#9CA3AF;cursor:pointer;font-family:'Cairo',sans-serif;margin-top:10px;}
.refresh-btn:hover{border-color:#9CA3AF;color:#6B7280;}

/* ── Unit cards ── */
.units-title{font-size:.75rem;font-weight:700;color:#9CA3AF;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;padding:0 2px;}
.unit-card{background:#fff;border-radius:16px;border:1.5px solid #E5E3DE;padding:18px 20px;cursor:pointer;transition:all .18s;box-shadow:0 2px 10px rgba(0,0,0,.05);margin-bottom:12px;}
.unit-card:hover{transform:translateY(-1px);box-shadow:0 4px 18px rgba(0,0,0,.1);}
.unit-card.locked-unit{opacity:.5;cursor:not-allowed;}
.unit-card.locked-unit:hover{transform:none;box-shadow:0 2px 10px rgba(0,0,0,.05);}
.uc-top{display:flex;align-items:flex-start;gap:14px;}
.uc-emoji{font-size:1.6rem;flex-shrink:0;margin-top:2px;}
.uc-info{flex:1;}
.uc-label{font-size:1rem;font-weight:700;margin-bottom:4px;}
.uc-meta{font-size:.75rem;color:#9CA3AF;display:flex;gap:10px;flex-wrap:wrap;}
.uc-badge{display:inline-block;border-radius:20px;padding:2px 10px;font-size:.7rem;font-weight:700;}
.uc-badge.done{background:#D1FAE5;color:#065F46;}
.uc-badge.locked{background:#F2F1EE;color:#9CA3AF;}
.uc-badge.progress{background:#DBEAFE;color:#1E40AF;}
.progress-wrap{margin-top:12px;}
.progress-lbl{display:flex;justify-content:space-between;font-size:.72rem;color:#9CA3AF;margin-bottom:4px;}
.progress-bar{height:5px;background:#F2F1EE;border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;border-radius:99px;transition:width .4s;}

/* ── Lesson cards ── */
.lesson-card{background:#fff;border-radius:13px;border:1.5px solid #E5E3DE;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:border .15s;}
.lesson-card:hover{border-color:#4338CA;}
.lesson-card.locked{opacity:.55;cursor:not-allowed;}
.lesson-card.locked:hover{border-color:#E5E3DE;}
.lc-top{display:flex;align-items:center;gap:12px;}
.lc-num{width:32px;height:32px;border-radius:8px;background:#F5F4F0;display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:700;color:#6B7280;flex-shrink:0;}
.lc-num.done{background:#D1FAE5;color:#065F46;}
.lc-title{flex:1;font-size:.9rem;font-weight:600;color:#1A1917;line-height:1.35;}
.lc-arrow{font-size:.85rem;color:#9CA3AF;}

/* ── Homework cards ── */
.hw-card{background:#fff;border-radius:13px;border:1.5px solid #E5E3DE;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:all .15s;}
.hw-card:hover{border-color:#4338CA;box-shadow:0 2px 12px rgba(67,56,202,.12);}
.hw-card.done{border-color:#D1FAE5;background:#F0FDF4;}
.hw-card.locked{opacity:.55;cursor:not-allowed;}
.hw-card.locked:hover{border-color:#E5E3DE;box-shadow:none;}
.hw-card.overdue{border-color:#FEE2E2;background:#FFF5F5;}
.hw-top{display:flex;align-items:flex-start;gap:12px;}
.hw-icon{width:36px;height:36px;border-radius:10px;background:#F5F4F0;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;}
.hw-card.done .hw-icon{background:#D1FAE5;}
.hw-card.overdue .hw-icon{background:#FEE2E2;}
.hw-info{flex:1;}
.hw-title{font-size:.9rem;font-weight:700;margin-bottom:4px;}
.hw-meta{font-size:.75rem;color:#9CA3AF;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.hw-score{background:#D1FAE5;color:#065F46;border-radius:99px;padding:1px 8px;font-size:.7rem;font-weight:700;}
.badge{border-radius:99px;padding:1px 8px;font-size:.7rem;font-weight:600;}
.badge.done{background:#D1FAE5;color:#065F46;}
.badge.overdue{background:#FEE2E2;color:#B91C1C;}
.hw-lessons{margin-top:8px;padding-top:8px;border-top:1px solid #F2F1EE;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.hw-lessons-lbl{font-size:.68rem;color:#9CA3AF;font-weight:600;}
.lesson-link{font-size:.75rem;background:#F5F4F0;border-radius:6px;padding:3px 8px;cursor:pointer;font-weight:600;color:#4338CA;}
.lesson-link:hover{background:#E0E7FF;}
.lesson-link .ln{display:inline-block;background:#4338CA;color:#fff;border-radius:4px;width:16px;height:16px;text-align:center;line-height:16px;font-size:.65rem;margin-right:4px;}

/* ── Loading / empty ── */
.loading{display:flex;align-items:center;justify-content:center;padding:48px 0;gap:10px;color:#9CA3AF;font-size:.88rem;}
.spinner{width:20px;height:20px;border:2px solid #E5E3DE;border-top-color:#4338CA;border-radius:50%;animation:spin .7s linear infinite;}
.spinner.dark{border-color:rgba(255,255,255,.2);border-top-color:#fff;}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:48px 0;color:#9CA3AF;}
.empty-icon{font-size:2rem;margin-bottom:8px;}
.section-lbl{font-size:.72rem;font-weight:700;color:#9CA3AF;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px;padding:0 2px;}

/* ── Toast ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1C1B18;color:#fff;border-radius:12px;padding:11px 22px;font-size:.85rem;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.25);z-index:9999;white-space:nowrap;pointer-events:none;font-family:'Cairo',sans-serif;}
</style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <div class="hdr">
    <div class="hdr-title">🎓 Learning Portal</div>
    <div id="hdr-sub" class="hdr-sub">Abdellah Guennoun High School — English</div>
    <div id="school-row" class="school-row" style="display:none;"></div>
    <div id="sbar" class="sbar">
      <div class="sbar-mini">
        <div>
          <div class="sbar-name" id="sbar-name"></div>
          <div class="sbar-cls" id="sbar-cls"></div>
        </div>
        <button class="sbar-btn" onclick="Portal.toggleBar()">▼ Details</button>
      </div>
      <div class="sbar-body" id="sbar-body" style="display:none;">
        <div class="sbar-grid">
          <div class="sf"><div class="sf-lbl">Massar</div><div class="sf-val" id="sf-massar"></div></div>
          <div class="sf"><div class="sf-lbl">Order</div><div class="sf-val" id="sf-order"></div></div>
          <div class="sf full"><div class="sf-lbl">Class</div><div class="sf-val" id="sf-class"></div></div>
        </div>
        <div class="score-bar">
          <span class="score-lbl">Total Score</span>
          <span class="score-val" id="total-score">—</span>
        </div>
        <button class="logout-btn" onclick="Portal.logout()">Sign out</button>
      </div>
    </div>
  </div>

  <!-- Login -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-title">Welcome 👋</div>
      <div class="login-sub">Enter your details to access your courses</div>
      <div class="field">
        <label>Massar Code</label>
        <input id="massar-inp" type="text" placeholder="e.g. N123456789" autocomplete="username" autocapitalize="characters">
      </div>
      <div class="field">
        <label>PIN</label>
        <input id="pin-inp" type="password" placeholder="4-digit PIN" autocomplete="current-password" inputmode="numeric">
      </div>
      <button class="login-btn" id="login-btn" onclick="Portal.login()">Sign in</button>
      <div class="err-msg" id="login-err"></div>
      <div class="login-school" id="login-school"></div>
    </div>
  </div>

  <!-- Main -->
  <div id="main-screen">
    <div id="content-wrap"></div>
  </div>
</div>

<script>
/* ================================================================
   CONFIGURATION — one place to change
   ================================================================ */
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxm0dKHveJHylft980UKOxImC9OMk4yhQ6RcYUpwbB3r3BX8Of-fBzAjGAFtJP-DsLH/exec';

/*
 UNIT_MAP: defines which units exist, which classes see them,
 and how to filter content items into units.
 idPrefix: items whose id starts with this prefix belong to this unit.
 lessonRange: [min, max] lessonNumber for CC units.
*/
var CC_IDS  = ['vYckXeY_GS','U889smjzQU','EhHw9lPmTZ','DVfRHIJMai','WQg786n7Gq'];
var BAC_IDS = ['zjNsrntmh7','GXPGjggyDv'];

var UNIT_MAP = [
  { unit:0,  label:'Warm-up',                emoji:'🌱', lessonRange:[1,2],   classIds:CC_IDS  },
  { unit:7,  label:'Unit 7 — The Arts',       emoji:'🎨', lessonRange:[3,11],  classIds:CC_IDS  },
  { unit:8,  label:'Unit 8 — Science & Tech', emoji:'🔬', lessonRange:[12,21], classIds:CC_IDS  },
  { unit:61, label:'Unit 6 — Cultural Issues',emoji:'🌍', lessonRange:[1,7],   classIds:BAC_IDS, idPrefix:'L-B6' },
  { unit:71, label:'Unit 7 — Citizenship',    emoji:'🏛️', lessonRange:[1,7],   classIds:BAC_IDS, idPrefix:'L-B7' },
];

/* ================================================================
   STATE — single object, never spread across loose globals
   ================================================================ */
var State = {
  session:    null,   /* { massarCode, pin, classId, termId, studentName, ... } */
  lessons:    [],
  homework:   [],
  activeUnit: null,   /* null = unit view, number = inside unit */
  activeTab:  'lessons',
  barOpen:    false,
};

/* ================================================================
   STORAGE helpers — thin wrappers, never throw
   ================================================================ */
var Store = {
  get: function(k)    { try { return localStorage.getItem(k); }         catch(e) { return null; } },
  set: function(k,v)  { try { localStorage.setItem(k, v); }             catch(e) {} },
  del: function(k)    { try { localStorage.removeItem(k); }             catch(e) {} },
  getJson: function(k){ try { return JSON.parse(localStorage.getItem(k)||'null'); } catch(e) { return null; } },
  setJson: function(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} },
};

/* ── Session: stored in localStorage with 12h expiry ── */
var SESSION_KEY = 'lp_session_v2';
var SESSION_TTL = 12 * 60 * 60 * 1000; /* 12 hours */

function saveSession(s) {
  s._savedAt = Date.now();
  Store.setJson(SESSION_KEY, s);
}
function loadSession() {
  var s = Store.getJson(SESSION_KEY);
  if (!s || !s.massarCode || !s.classId) return null;
  if (s._savedAt && Date.now() - s._savedAt > SESSION_TTL) { Store.del(SESSION_KEY); return null; }
  return s;
}
function clearSession() { Store.del(SESSION_KEY); }

/* ── Return marker: set before navigating to lesson/homework ── */
var RETURN_KEY = function() { return 'lp_return_'+( State.session ? State.session.massarCode : 'x'); };
function setReturn()  { Store.setJson(RETURN_KEY(), { tab:State.activeTab, unit:State.activeUnit }); }
function getReturn()  { return Store.getJson(RETURN_KEY()); }
function clearReturn(){ Store.del(RETURN_KEY()); }

/* ================================================================
   API — single fetch wrapper
   ================================================================ */
function api(body) {
  return fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(body),
    redirect: 'follow'
  }).then(function(r) { return r.json(); });
}

/* ================================================================
   Portal — main controller
   ================================================================ */
var Portal = {

  /* ── Login ── */
  login: function() {
    var massar = document.getElementById('massar-inp').value.trim().toUpperCase();
    var pin    = document.getElementById('pin-inp').value.trim();
    var err    = document.getElementById('login-err');
    err.style.display = 'none';
    if (!massar || !pin) { Portal.showErr('Enter your Massar code and PIN.'); return; }

    Portal.setLoginLoading(true);
    api({ action:'loginContainer', massarCode:massar, pin:pin })
      .then(function(d) {
        Portal.setLoginLoading(false);
        if (!d.ok) { Portal.showErr(d.error || 'Login failed.'); return; }
        State.session = d;
        State.session._pin = pin;
        saveSession(State.session);
        Portal.enterApp();
        Portal.loadContent();
      })
      .catch(function() {
        Portal.setLoginLoading(false);
        Portal.showErr('Connection failed. Check your internet and try again.');
      });
  },

  setLoginLoading: function(on) {
    var b = document.getElementById('login-btn');
    b.disabled   = on;
    b.innerHTML  = on ? '<div class="spinner" style="width:18px;height:18px;display:inline-block;margin-bottom:-4px;"></div> Signing in…' : 'Sign in';
  },

  showErr: function(msg) {
    var el = document.getElementById('login-err');
    el.textContent   = msg;
    el.style.display = 'block';
  },

  /* ── Enter app after login ── */
  enterApp: function() {
    var s = State.session;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-screen').style.display  = 'flex';
    document.getElementById('main-screen').style.flexDirection = 'column';

    /* School info in header */
    if (s.schoolName || s.teacherName) {
      var row = document.getElementById('school-row');
      row.textContent = [s.schoolName, s.teacherName, s.academicYear].filter(Boolean).join(' · ');
      row.style.display = 'block';
      document.getElementById('hdr-sub').style.display = 'none';
    }

    /* Student bar */
    var sbar = document.getElementById('sbar');
    sbar.style.display = 'block';
    document.getElementById('sbar-name').textContent = s.studentName || s.massarCode;
    document.getElementById('sbar-cls').textContent  = s.className   || s.classId;
    document.getElementById('sf-massar').textContent = s.massarCode;
    document.getElementById('sf-order').textContent  = s.orderNumber || '—';
    document.getElementById('sf-class').textContent  = s.className   || s.classId;

    Store.set('lp_prev_'+s.massarCode, new Date().toISOString());
  },

  toggleBar: function() {
    State.barOpen = !State.barOpen;
    var body = document.getElementById('sbar-body');
    var btn  = document.querySelector('.sbar-btn');
    body.style.display = State.barOpen ? 'block' : 'none';
    btn.textContent    = State.barOpen ? '▲ Close' : '▼ Details';
  },

  logout: function() {
    clearSession();
    State.session = null; State.lessons = []; State.homework = [];
    State.activeUnit = null; State.activeTab = 'lessons';
    document.getElementById('sbar').style.display        = 'none';
    document.getElementById('main-screen').style.display = 'none';
    document.getElementById('login-screen').style.display= 'block';
    document.getElementById('massar-inp').value = '';
    document.getElementById('pin-inp').value    = '';
    document.getElementById('login-err').style.display = 'none';
  },

  /* ================================================================
     loadContent — single API call, replaces old getContentList + pullSubmissions
     ================================================================ */
  loadContent: function() {
    var wrap = document.getElementById('content-wrap');
    wrap.innerHTML = '<div class="loading"><div class="spinner"></div>Loading…</div>';
    var s = State.session;

    api({ action:'getPortalData', classId:s.classId, termId:s.termId, massarCode:s.massarCode })
      .then(function(d) {
        if (!d.ok) {
          wrap.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>'+(d.error||'Error loading content')+'</div>';
          return;
        }
        State.lessons  = d.lessons  || [];
        State.homework = d.homework || [];

        Portal.updateTotalScore();
        Portal.render();
      })
      .catch(function() {
        wrap.innerHTML = '<div class="empty"><div class="empty-icon">📡</div>Connection failed — <a href="#" onclick="Portal.loadContent();return false;" style="color:#4338CA;">try again</a></div>';
      });
  },

  /* ── Update total score badge ── */
  updateTotalScore: function() {
    var total = 0, max = 0;
    State.homework.forEach(function(hw) {
      if (hw.submissionCount > 0 && hw.submittedScore !== null) {
        total += (hw.submittedScore || 0);
        max   += (hw.submittedMaxScore || hw.maxScore || 20);
      }
    });
    var el = document.getElementById('total-score');
    if (el) el.textContent = max > 0 ? (total + ' / ' + max) : '—';
  },

  /* ================================================================
     render — routes to correct view
     ================================================================ */
  render: function() {
    if (State.activeUnit !== null) {
      Portal.renderContentView();
    } else {
      Portal.renderUnitView();
    }
  },

  /* ── Unit view — cards ── */
  renderUnitView: function() {
    var wrap  = document.getElementById('content-wrap');
    var s     = State.session;
    var myClass = s ? (s.classId || '') : '';

    var visible = UNIT_MAP.filter(function(u) {
      if (!u.classIds.some(function(c){ return c === myClass; })) return false;
      return true;
    });

    if (!visible.length) {
      wrap.innerHTML = '<div class="empty"><div class="empty-icon">📚</div>No courses found for your class.</div>';
      return;
    }

    var html = '<div class="units-title">My Courses</div>';
    visible.forEach(function(u) {
      var lessons  = Portal.getLessonsForUnit(u);
      var homework = Portal.getHomeworkForUnit(u);
      var totalL   = lessons.length;
      var doneL    = lessons.filter(function(l){ return !l.locked; }).length;
      var totalHW  = homework.length;
      var doneHW   = homework.filter(function(h){ return h.submissionCount > 0; }).length;
      var allLocked= totalL > 0 && lessons.every(function(l){ return l.locked; });
      var allDone  = totalHW > 0 && doneHW === totalHW;

      var badge = '';
      if (allLocked && u.unit !== 0) {
        badge = '<span class="uc-badge locked">🔒 Locked</span>';
      } else if (allDone) {
        badge = '<span class="uc-badge done">✅ Complete</span>';
      } else {
        badge = '<span class="uc-badge progress">📖 In Progress</span>';
      }

      var pct   = totalL > 0 ? Math.round(doneL / totalL * 100) : 0;
      var color = allLocked ? '#D1D5DB' : allDone ? '#10B981' : '#4338CA';

      html += '<div class="unit-card'+(allLocked && u.unit!==0?' locked-unit':'')+'" onclick="Portal.openUnit('+u.unit+')">'
        + '<div class="uc-top">'
        +   '<div class="uc-emoji">'+u.emoji+'</div>'
        +   '<div class="uc-info">'
        +     '<div class="uc-label">'+esc(u.label)+'</div>'
        +     '<div class="uc-meta">'
        +       '<span>'+totalL+' lessons</span>'
        +       '<span>'+totalHW+' homework</span>'
        +       badge
        +     '</div>'
        +   '</div>'
        + '</div>'
        + '<div class="progress-wrap">'
        +   '<div class="progress-lbl"><span>Progress</span><span>'+doneL+'/'+totalL+'</span></div>'
        +   '<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%;background:'+color+';"></div></div>'
        + '</div>'
        + '</div>';
    });

    wrap.innerHTML = html;
  },

  /* ── Content view — inside a unit ── */
  renderContentView: function() {
    var wrap = document.getElementById('content-wrap');
    var u    = UNIT_MAP.find(function(x){ return x.unit === State.activeUnit; });
    var label = u ? u.label : 'Unit';

    var html = '<div class="back-row">'
      + '<button class="back-btn" onclick="Portal.closeUnit()">← Units</button>'
      + '<span class="unit-name">'+esc(label)+'</span>'
      + '</div>'
      + '<div class="tabs">'
      + '<button class="tab'+(State.activeTab==='lessons'?' active':'')+'" onclick="Portal.setTab(\'lessons\')">📖 Lessons</button>'
      + '<button class="tab'+(State.activeTab==='homework'?' active':'')+'" onclick="Portal.setTab(\'homework\')">📝 Homework</button>'
      + '</div>'
      + '<div id="tab-wrap"></div>';

    wrap.innerHTML = html;
    Portal.renderTab();
  },

  renderTab: function() {
    var wrap = document.getElementById('tab-wrap');
    if (!wrap) return;
    if (State.activeTab === 'lessons') {
      Portal.renderLessons(wrap);
    } else {
      Portal.renderHomework(wrap);
    }
  },

  renderLessons: function(wrap) {
    var u       = UNIT_MAP.find(function(x){ return x.unit === State.activeUnit; });
    var lessons = Portal.getLessonsForUnit(u);

    if (!lessons.length) {
      wrap.innerHTML = '<div class="empty"><div class="empty-icon">📖</div>No lessons yet.</div>';
      return;
    }

    var html = lessons.map(function(l) {
      var locked = !!l.locked;
      var done   = l.submissionCount > 0; /* lesson viewed+passed */
      return '<div class="lesson-card'+(locked?' locked':'')+'" onclick="'+(locked?'Portal.locked()':'Portal.openItem(\'lesson\',\''+esc(l.id)+'\')') +'">'
        + '<div class="lc-top">'
        +   '<div class="lc-num'+(done?' done':'')+'">'+( locked ? '🔒' : (l.lessonNumber||'—') )+'</div>'
        +   '<div class="lc-title">'+esc(l.title)+'</div>'
        +   (!locked ? '<span class="lc-arrow">→</span>' : '')
        + '</div>'
        + '</div>';
    }).join('');

    html += '<button class="refresh-btn" onclick="Portal.loadContent()">↻ Refresh</button>';
    wrap.innerHTML = html;
  },

  renderHomework: function(wrap) {
    var u       = UNIT_MAP.find(function(x){ return x.unit === State.activeUnit; });
    var hw      = Portal.getHomeworkForUnit(u);

    if (!hw.length) {
      wrap.innerHTML = '<div class="empty"><div class="empty-icon">📝</div>No homework yet.</div>';
      return;
    }

    var active  = hw.filter(function(h){ return !h.isOverdue; });
    var overdue = hw.filter(function(h){ return h.isOverdue;  });

    var html = '';
    if (active.length)  html += active.map(Portal.hwCard).join('');
    if (overdue.length) html += '<div class="section-lbl" style="color:#B91C1C;">Past Due</div>'
                              + overdue.map(Portal.hwCard).join('');
    html += '<button class="refresh-btn" onclick="Portal.loadContent()">↻ Refresh</button>';
    wrap.innerHTML = html;
  },

  hwCard: function(hw) {
    var tok    = hw.assignmentToken || hw.id;
    var isDone = hw.submissionCount > 0;
    var locked = !!hw.locked;
    var cls    = 'hw-card' + (locked?' locked': isDone?' done': hw.isOverdue?' overdue':'');

    var icon   = locked?'🔒': isDone?'✅': hw.isOverdue?'⏰':'📝';
    var badge  = isDone
      ? '<span class="badge done">Submitted</span>'
      : hw.isOverdue ? '<span class="badge overdue">Overdue</span>' : '';
    var score  = isDone && hw.submittedScore !== null
      ? '<span class="hw-score">'+hw.submittedScore+' / '+(hw.submittedMaxScore||hw.maxScore||20)+'</span>'
      : '';

    var lessons = '';
    if (hw.linkedLessons && hw.linkedLessons.length) {
      lessons = '<div class="hw-lessons">'
        + '<span class="hw-lessons-lbl">Covers:</span>'
        + hw.linkedLessons.map(function(ll) {
            return '<span class="lesson-link" onclick="event.stopPropagation();Portal.openItem(\'lesson\',\''+esc(ll.id)+'\')">'
              + '<span class="ln">'+ll.lessonNumber+'</span>'+esc(ll.title)+'</span>';
          }).join('')
        + '</div>';
    }

    var click = locked
      ? 'Portal.locked()'
      : 'Portal.openItem(\'homework\',\''+esc(hw.id)+'\')';

    return '<div class="'+cls+'" onclick="'+click+'">'
      + '<div class="hw-top">'
      +   '<div class="hw-icon">'+icon+'</div>'
      +   '<div class="hw-info">'
      +     '<div class="hw-title">'+esc(hw.title)+'</div>'
      +     '<div class="hw-meta">'
      +       (hw.subject?'<span>'+esc(hw.subject)+'</span>':'')
      +       (hw.dueDate?'<span>Due '+hw.dueDate+'</span>':'')
      +       badge + score
      +     '</div>'
      +   '</div>'
      + '</div>'
      + lessons
      + '</div>';
  },

  /* ================================================================
     Navigation
     ================================================================ */
  openUnit: function(unitNum) {
    var u = UNIT_MAP.find(function(x){ return x.unit === unitNum; });
    if (!u) return;
    var lessons = Portal.getLessonsForUnit(u);
    if (unitNum !== 0 && lessons.length && lessons.every(function(l){ return l.locked; })) {
      Portal.toast('🔒 Complete the previous unit first.');
      return;
    }
    State.activeUnit = unitNum;
    State.activeTab  = 'lessons';
    Portal.renderContentView();
  },

  closeUnit: function() {
    State.activeUnit = null;
    Portal.renderUnitView();
  },

  setTab: function(tab) {
    State.activeTab = tab;
    /* Update tab button active states directly — no full re-render needed */
    document.querySelectorAll('.tabs .tab').forEach(function(btn) {
      var isActive = btn.textContent.toLowerCase().indexOf(tab) >= 0 ||
                     (tab === 'lessons'  && btn.textContent.indexOf('Lessons')  >= 0) ||
                     (tab === 'homework' && btn.textContent.indexOf('Homework') >= 0);
      btn.classList.toggle('active', isActive);
    });
    Portal.renderTab();
  },

  locked: function() {
    Portal.toast('🔒 Complete the previous step first.');
  },

  /* ── Navigate to lesson or homework page ── */
  openItem: function(type, id) {
    var item = type === 'lesson'
      ? State.lessons.find(function(l){ return l.id === id; })
      : State.homework.find(function(h){ return h.id === id; });

    if (!item || !item.fileUrl) { Portal.toast('⚠ File not available. Contact your teacher.'); return; }
    if (item.locked) { Portal.locked(); return; }

    /* Save return state so we reload on back */
    setReturn();

    var s   = State.session;
    var tok = item.assignmentToken || item.id;

    /*
     Pass all context in hash params.
     Homework pages read token from hash — never from TEACHER_CONFIG.
     This prevents token mismatch even if the file has an old baked-in value.
    */
    var params = new URLSearchParams({
      massarCode:      s.massarCode,
      pin:             s._pin || '',
      classId:         s.classId,
      termId:          s.termId || 's1',
      studentName:     s.studentName || '',
      scriptUrl:       SCRIPT_URL,
      contentType:     type,
      contentId:       item.id,
      homeworkId:      item.id,
      assignmentToken: tok,   /* <-- authoritative token from backend */
      lessonNumber:    item.lessonNumber || '',
    });

    /* Resolve URL — three cases:
       1. Sheet has a direct GitHub Pages URL → use it as-is
       2. Backend returns ?page= fallback → rewrite to GitHub Pages URL
       3. Empty → show error */
    var url = item.fileUrl || '';
    if (!url) {
      Portal.toast('⚠ File not available. Contact your teacher.');
      return;
    }
    if (url.indexOf('?page=') >= 0) {
      var pageId = decodeURIComponent(url.split('?page=')[1].split('&')[0]);
      /* Use the configured base — same repo as the portal */
      url = 'https://cimikool.github.io/portal1/' + pageId + '.html';
    }
    /* Sanity check: log the final URL so you can debug in console */
    console.log('[Portal] navigating to:', url);

    window.location.href = url + '#' + params.toString();
  },

  /* ================================================================
     Unit filtering helpers
     ================================================================ */
  getLessonsForUnit: function(u) {
    if (!u) return [];
    return State.lessons.filter(function(l) {
      if (u.idPrefix) {
        return l.id.indexOf(u.idPrefix) >= 0;
      }
      var n = l.lessonNumber || 0;
      return n >= u.lessonRange[0] && n <= u.lessonRange[1];
    });
  },

  getHomeworkForUnit: function(u) {
    if (!u) return [];
    return State.homework.filter(function(h) {
      if (u.idPrefix) {
        /* Match by idPrefix on either hw.id or linked lesson ids */
        if (h.id.indexOf(u.idPrefix.replace('L-','HW-')) >= 0) return true;
        if (h.id.indexOf(u.idPrefix.replace('L-B','HW-B')) >= 0) return true;
        /* Also match by linked lesson */
        return h.linkedLessons && h.linkedLessons.some(function(ll){
          return ll.id.indexOf(u.idPrefix) >= 0;
        });
      }
      /* CC: match by linked lesson number range */
      if (h.linkedLessons && h.linkedLessons.length) {
        var n = h.linkedLessons[0].lessonNumber || 0;
        return n >= u.lessonRange[0] && n <= u.lessonRange[1];
      }
      var hn = h.lessonNumber || 0;
      return hn >= u.lessonRange[0] && hn <= u.lessonRange[1];
    });
  },

  /* ── Toast ── */
  toast: function(msg) {
    var t = document.createElement('div');
    t.className   = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 3500);
  },
};

/* ── HTML escape ── */
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── Keyboard ── */
document.getElementById('pin-inp').addEventListener('keydown', function(e){ if(e.key==='Enter') Portal.login(); });
document.getElementById('massar-inp').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('pin-inp').focus(); });

/* ================================================================
   INIT — runs on page load
   ================================================================ */
(function init() {
  var s = loadSession();
  if (s && s.massarCode && s.classId) {
    State.session = s;

    /* Restore navigation state if returning from lesson/homework */
    var ret = getReturn();
    if (ret) {
      clearReturn();
      State.activeTab  = ret.tab  || 'lessons';
      State.activeUnit = (ret.unit !== null && ret.unit !== undefined && ret.unit !== '') ? parseInt(ret.unit) : null;
    }

    Portal.enterApp();
    Portal.loadContent();
  }
})();

/* ── Reload on bfcache restore (browser back button) ── */
window.addEventListener('pageshow', function(e) {
  if (e.persisted && State.session) {
    var ret = getReturn();
    if (ret) {
      clearReturn();
      State.activeTab  = ret.tab  || 'lessons';
      State.activeUnit = (ret.unit !== null && ret.unit !== '') ? parseInt(ret.unit) : null;
    }
    Portal.loadContent();
  }
});
</script>
</body>
</html>
